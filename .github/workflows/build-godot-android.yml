name: Build LAST-ZONE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Godot/**"
      - ".github/workflows/build-godot-android.yml"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: 4.4.1
      ANDROID_NDK_VERSION: 23.2.8568313
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python and Android SDK
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;23.2.8568313"

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Download Godot C++ bindings
        run: git clone --depth 1 --branch 4.4 https://github.com/godotengine/godot-cpp.git Godot/godot-cpp

      - name: Build Linux editor and Android ARM64 GDExtension libraries
        working-directory: Godot
        run: |
          set -euxo pipefail
          scons platform=linux target=template_release arch=x86_64
          echo "Linux GDExtension build output:"
          find bin -maxdepth 1 -type f -name '*.so' -print
          LINUX_LIB="$(find bin -maxdepth 1 -type f -name 'liblast_zone*.so' ! -name '*android*' | head -n 1)"
          if [ -z "$LINUX_LIB" ]; then
            echo "::error::Linux GDExtension library was not produced by SCons."
            exit 1
          fi
          cp "$LINUX_LIB" bin/liblast_zone.linux.template_release.x86_64.so
          test -s bin/liblast_zone.linux.template_release.x86_64.so

          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          # godot-cpp's SharedLibrary target is emitted as bin/liblast_zone.so.
          # Preserve each Android build immediately under the filename Godot expects.
          scons platform=android target=template_debug arch=arm64
          test -s bin/liblast_zone.so
          cp bin/liblast_zone.so bin/liblast_zone.android.template_debug.arm64.so
          test -s bin/liblast_zone.android.template_debug.arm64.so

          scons platform=android target=template_release arch=arm64
          test -s bin/liblast_zone.so
          cp bin/liblast_zone.so bin/liblast_zone.android.template_release.arm64.so
          test -s bin/liblast_zone.android.template_release.arm64.so

          echo "All GDExtension libraries:"
          find bin -maxdepth 1 -type f -name '*.so' -print

      - name: Download Godot editor and export templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          curl -L --fail "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/editor.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot"
          curl -L --fail "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"

      - name: Configure Godot Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          # Godot 4.4 loads the versioned editor settings file below.
          # Writing editor_settings-4.tres is ignored by Godot 4.4.1.
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"
          grep -F 'export/android/android_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep -F 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import project and validate scripts
        run: |
          GODOT_BIN=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*.x86_64' | head -n 1)
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path Godot --editor --quit

      - name: Validate Android export prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_BIN=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*.x86_64' | head -n 1)
          test -x "$GODOT_BIN"
          test -d "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          test -s "$HOME/.android/debug.keystore"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/cmdline-tools"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -s Godot/bin/liblast_zone.android.template_debug.arm64.so
          test -s Godot/bin/liblast_zone.android.template_release.arm64.so
          test -s Godot/bin/liblast_zone.linux.template_release.x86_64.so
          echo "Godot editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "Android export preset:"
          cat Godot/export_presets.cfg

      - name: Export universal ARM64 Android APK
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_BIN=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*.x86_64' | head -n 1)
          test -n "$GODOT_BIN"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export JAVA_HOME="$JAVA_HOME"
          mkdir -p build
          # Refresh the editor's project metadata after all native libraries and Android
          # export templates have been installed, then run the Android export.
          "$GODOT_BIN" --headless --editor --path Godot --quit --verbose
          # Export with the debug keystore supplied through Godot's documented environment variables.
          "$GODOT_BIN" --headless --path Godot --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/LAST-ZONE-Android-arm64.apk"
          test -s build/LAST-ZONE-Android-universal.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-ZONE-Android-APK
          path: build/LAST-ZONE-Android-universal.apk
          if-no-files-found: error
          retention-days: 14
